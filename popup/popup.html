<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kurdish Learning</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
<div id="app">

  <!-- ── Home Screen ── -->
  <div id="home-screen" class="screen active">
    <div class="home-header">
      <div class="logo">ک</div>
      <h1>Kurdish Sorani</h1>
      <p class="subtitle">Master the alphabet, one letter at a time</p>
    </div>
    <div class="home-btns">
      <button id="btn-flashcards" class="btn-primary">Flashcards</button>
      <button id="btn-browse"     class="btn-secondary">Browse All Letters</button>
    </div>
    <p class="tip">Tip: Highlight any Kurdish letter on a webpage to see its name and pronunciation.</p>
  </div>

  <!-- ── Flashcard Screen ── -->
  <div id="flashcard-screen" class="screen">
    <div class="top-bar">
      <button class="btn-back js-back">← Back</button>
      <span id="fc-progress">1 / 33</span>
      <button id="btn-shuffle" class="btn-icon" title="Shuffle">⇌</button>
    </div>

    <div class="progress-bar">
      <div id="progress-fill" class="progress-fill"></div>
    </div>

    <div id="card" class="card">
      <div class="card-inner" id="card-inner">
        <div class="card-face card-front">
          <div class="card-glyph" id="fc-letter"></div>
          <div class="card-hint">tap to reveal</div>
        </div>
        <div class="card-face card-back">
          <div class="card-glyph-sm" id="fc-letter-back"></div>
          <div class="card-name"  id="fc-name"></div>
          <div class="card-pron"  id="fc-pron"></div>
          <div class="card-ipa"   id="fc-ipa"></div>
        </div>
      </div>
    </div>

    <div class="card-controls">
      <button id="btn-prev" class="btn-nav">‹</button>
      <div class="rate-btns">
        <button id="btn-again" class="btn-again">✗ Again</button>
        <button id="btn-got"   class="btn-got">✓ Got it</button>
      </div>
      <button id="btn-next" class="btn-nav">›</button>
    </div>
  </div>

  <!-- ── Browse Screen ── -->
  <div id="browse-screen" class="screen">
    <div class="top-bar">
      <button class="btn-back js-back">← Back</button>
      <span>All 33 Letters</span>
      <span></span>
    </div>
    <div id="alphabet-grid" class="alphabet-grid"></div>
  </div>

</div>

<script src="../data/alphabet.js"></script>
<script src="popup.js"></script>
</body>
</html>
